[[file]]
src = "glb/f15.glb"
dst = "glb/f15.glb"

[[file_group]]
regex = 'sounds/(.*)'
dst = 'sounds/$1'
src = [
    "sounds/pong1.wav",
    "sounds/synth.ogg",
]

[[file_group]]
regex = 'svg/ionicons/([\w\-]+\.svg)'
dst = 'svg/$1'
src = [
    "svg/ionicons/ios-search.svg",
    "svg/ionicons/ios-square-outline.svg",
    "svg/ionicons/ios-square.svg",
    "svg/ionicons/md-add.svg",
    "svg/ionicons/md-arrow-back.svg",
    "svg/ionicons/md-arrow-down.svg",
    "svg/ionicons/md-arrow-dropdown.svg",
    "svg/ionicons/md-arrow-dropleft.svg",
    "svg/ionicons/md-arrow-dropright.svg",
    "svg/ionicons/md-arrow-dropup.svg",
    "svg/ionicons/md-arrow-forward.svg",
    "svg/ionicons/md-arrow-up.svg",
    "svg/ionicons/md-checkmark.svg",
    "svg/ionicons/md-close.svg",
]

[[file_group]]
regex = 'textures/(.*)'
dst = 'textures/$1'
src = [
    "textures/particle_lightning.png",
    "textures/particle_smoke.png",
    "textures/pomdog-dxt1.dds",
    "textures/pomdog-dxt5.dds",
    "textures/pomdog-p1.pbm",
    "textures/pomdog-p2.pgm",
    "textures/pomdog-p3.ppm",
    "textures/pomdog-p4.pbm",
    "textures/pomdog-p5.pgm",
    "textures/pomdog-p6.ppm",
    "textures/pomdog.png",
]

[[file]]
src = "voxel_models/maidchan.vox"
dst = "voxel_models/maidchan.vox"
