<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Quickstart - Pomdog</title>

    <style>
        body {
            background-color: #222;
            color: #ccc;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        canvas {
            padding: 0;
            display: block;
            margin: 0 auto;
            background-color: #0c1012;
        }
        .stage {
            position: relative;
            width: fit-content;
            margin: 0 auto;
        }
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #999;
            font-size: 16px;
        }
        .loading-bar {
            width: 40%;
            height: 8px;
            background-color: #333;
            overflow: hidden;
        }
        .loading-bar-fill {
            width: 0;
            height: 100%;
            background-color: #ccc;
        }
        .loading-bar.indeterminate .loading-bar-fill {
            width: 30%;
            animation: loading-slide 1.2s ease-in-out infinite;
        }
        @keyframes loading-slide {
            from { transform: translateX(-100%); }
            to { transform: translateX(340%); }
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }
        .btn-group {
            margin: 10px 0;
        }
        .btn {
            padding: 8px 16px;
            margin: 0 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #0d6efd;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="stage">
        <!-- NOTE: Keep width and height equal to clientWidth and clientHeight in
             source/game_setup.cpp, so the canvas appears at its final size
             before the game starts. -->
        <canvas id="canvas" width="800" height="480" oncontextmenu="event.preventDefault()" style="padding: 0px;"></canvas>
        <div id="loading" class="loading">
            <div id="loadingBar" class="loading-bar indeterminate"><div id="loadingBarFill" class="loading-bar-fill"></div></div>
            <div id="loadingText">Loading...</div>
        </div>
    </div>

    <div class="container">
        <div class="btn-group">
            <button id="softFullscreenButton" type="button" class="btn btn-secondary">Windowed Fullscreen</button>
            <button id="fullscreenButton" type="button" class="btn btn-primary">Fullscreen</button>
        </div>
        <hr>
        <p>Source code: <a href="https://github.com/mogemimi/pomdog" style="color: #6ea8fe;">https://github.com/mogemimi/pomdog</a></p>
    </div>

    <script type='text/javascript'>
        var canv = document.getElementById('canvas');
        var loading = document.getElementById('loading');
        var loadingBar = document.getElementById('loadingBar');
        var loadingBarFill = document.getElementById('loadingBarFill');
        var loadingText = document.getElementById('loadingText');

        function toMegabytes(bytes) {
            return (bytes / (1024 * 1024)).toFixed(1);
        }

        var Module = {
            canvas: canv,
            onDownloadProgress: function (loaded, total) {
                if (total <= 0) {
                    loadingText.textContent = 'Loading... ' + toMegabytes(loaded) + ' MB';
                    return;
                }
                loadingBar.classList.remove('indeterminate');
                loadingBarFill.style.width = Math.min(100, loaded / total * 100) + '%';
                loadingText.textContent = (loaded >= total)
                    ? 'Starting...'
                    : 'Loading... ' + toMegabytes(loaded) + ' / ' + toMegabytes(total) + ' MB';
            },
            onAbort: function (what) {
                loadingBar.hidden = true;
                loadingText.textContent = 'Failed to start: ' + what;
            },
            // NOTE: postRun runs after main() has initialized the game and
            // scheduled its main loop, so the first frame replaces the overlay.
            postRun: function () {
                loading.remove();
            }
        };
    </script>

    <!-- NOTE: Load the engine script asynchronously so that the page and the
         loading screen paint without waiting for it. -->
    <script async src="./quickstart.js"></script>

    <script type='text/javascript'>
        fullscreenButton.addEventListener('click', function() { _pomdog_enter_full_screen(); }, false);
        softFullscreenButton.addEventListener('click', function() { _pomdog_enter_soft_full_screen(); }, false);
    </script>
</body>

</html>
